<!DOCTYPE html>
<html lang="en" class="wa-theme-tailspin wa-palette-vogue wa-brand-indigo" data-fa-kit-code="4f5838335e">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    
    <!-- Web Awesome — pinned CDN (webawesome@3.9.0); replaces the opaque kit script -->
    <!-- Theme + color palette -->
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/43e2fc18755d4267/webawesome@3.9.0/styles/themes/tailspin.css" />
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/43e2fc18755d4267/webawesome@3.9.0/styles/color/palettes/vogue.css" />
    <!-- Native styles / CSS reset -->
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/43e2fc18755d4267/webawesome@3.9.0/styles/native.css" />
    <!-- CSS utilities -->
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/43e2fc18755d4267/webawesome@3.9.0/styles/utilities.css" />
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.bunny.net/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" />
    <!-- Web Awesome autoloader -->
    <script type="module" src="https://ka-p.webawesome.com/kit/43e2fc18755d4267/webawesome@3.9.0/webawesome.loader.js"></script>
    <!-- Custom theme overrides -->
    <style>
      :root {
        --wa-font-family-body: Inter, sans-serif;
        --wa-font-family-heading: Inter, sans-serif;
        --wa-font-family-code: ui-monospace, monospace;
        --wa-font-family-longform: ui-serif, serif;
        --wa-font-weight-body: 400;
        --wa-font-weight-heading: 700;
        --wa-font-weight-code: 400;
        --wa-font-weight-longform: 400;
        --wa-border-radius-scale: 1;
        --wa-border-width-scale: 1;
        --wa-space-scale: 0.875;
      }
    </style>

    <!-- Minimal styling -->
    <style>
        body {
            padding: 20px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Use a content wrapper for better readability */
        main {
            max-width: 900px;
        }

        wa-card, wa-details, wa-tab-group {
            margin-top: 1rem;
            display: block;
        }

        /* Callouts in a flex container to show size differences */
        wa-callout {
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        /* Create visual grouping for component examples */
        h3 + wa-callout,
        p + wa-callout,
        wa-callout + wa-callout {
            margin-top: 0.5rem;
        }

        /* Inline components */
        wa-button, wa-tag, wa-badge {
            margin-top: 1rem;
        }

        /* Code blocks */
        pre, code {
            background: #f8f9fa;
            border-radius: 4px;
            padding: 0.2em 0.4em;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.9em;
        }

        pre {
            padding: 1rem;
            overflow-x: auto;
        }

        /* Add visual separation between component groups */
        h2 {
            border-top: 1px solid #e9ecef;
            padding-top: 2rem;
        }

        h2:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        /* Heading styles */
        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 0.5rem;
        }
        
        h2 {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            padding-left: 1rem;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        
        h3 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #34495e;
            padding-left: 0.75rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }

        h4 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #34495e;
            padding-left: 0.5rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }

        /* First heading spacing adjustment */
        h2:first-of-type {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            {{ content }}
        </main>
    </div>
</body>
</html>
