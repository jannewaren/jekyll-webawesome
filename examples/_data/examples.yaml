  - id: "overlays"
    title: "Overlays"
    intro: |
      Floating UI attached to a trigger: modal dialogs, popovers, and inline tooltips. Plain Markdown images can also auto-open in a click-to-zoom dialog when the plugin’s image-dialog option is on.
    components:
      - "<wa-dialog>"
      - "<wa-popover>"
      - "<wa-tooltip>"
    examples:
      - heading: "Dialog"
      - title: "Basic"
        description: "The text before `>>>` becomes the trigger button; the text after is the dialog body."
        code: |
          ???
          Open dialog
          >>>
          Dialog content with **markdown** support.
          ???
      - title: "Light dismiss"
        code: |
          ???light-dismiss
          Open (click outside to close)
          >>>
          Clicking the overlay dismisses this dialog.
          ???
      - title: "Custom width"
        code: |
          ???width:400px
          Open a narrow dialog
          >>>
          This dialog is 400px wide.
          ???
      - heading: "Image dialog"
      - title: "Auto-zoom"
        description: "With the plugin’s image-dialog option enabled, every standalone Markdown image becomes a click-to-zoom `<wa-dialog>` — no sigils needed. This whole demo runs with it on, so click the image."
        code: |
          ![A porch swing by a forest pond](../assets/photo.jpg)
      - title: "Custom dialog width"
        description: "A CSS width in the image title — `\"60%\"`, `\"800px\"`, `\"90vw\"` — sizes that image’s dialog. Thumbnails look identical until you open them."
        code: |
          ![A porch swing by a forest pond](../assets/photo.jpg "60%")
      - title: "Opt out with nodialog"
        description: "Add `\"nodialog\"` to the title to leave an image as a plain, non-clickable `<img>`."
        code: |
          ![A porch swing by a forest pond](../assets/photo.jpg "nodialog")
      - heading: "Popover"
      - title: "Placement: top"
        code: |
          &&&top
          Hover me (top)
          >>>
          Popover shown on the `top` side.
          &&&
      - title: "Placement: bottom"
        code: |
          &&&bottom
          Hover me (bottom)
          >>>
          Popover shown on the `bottom` side.
          &&&
      - title: "Placement: left"
        code: |
          &&&left
          Hover me (left)
          >>>
          Popover shown on the `left` side.
          &&&
      - title: "Placement: right"
        code: |
          &&&right
          Hover me (right)
          >>>
          Popover shown on the `right` side.
          &&&
      - title: "Link trigger, no arrow"
        code: |
          &&&link without-arrow
          More info
          >>>
          Rendered from a link-styled trigger with no arrow.
          &&&
      - title: "Inline popover"
        description: "The inline form `&&&trigger >>> content&&&` works inside a paragraph."
        code: |
          Click &&&here >>> This popover appears inline, mid-sentence.&&& to learn more.
      - heading: "Tooltip"
      - title: "Inline"
        description: "The inline form `(((anchor >>> tip)))` underlines the anchor and shows the tip on hover or focus."
        code: |
          Styled with (((CSS >>> Cascading Style Sheets))) on the web.
      - title: "Placement: top"
        code: |
          (((top top tip >>> Shown on the top side.)))
      - title: "Placement: bottom-start"
        code: |
          (((bottom-start bottom-start tip >>> Shown on the bottom-start side.)))
      - title: "Placement: right"
        code: |
          (((right right tip >>> Shown on the right side.)))
      - title: "Multi-line tip"
        description: "Use `\\n` inside the tip for line breaks."
        code: |
          (((Org number >>> NO: 9 digits\nSE: 10 digits))) varies by country.
  - id: "icons"
    title: "Icons & dates"
    intro: |
      Standalone icons plus build-time-baked dates. Icons, dates, and relative times render text into shadow DOM, so they need Web Awesome’s runtime to appear.
    components:
      - "<wa-icon>"
      - "<wa-format-date>"
      - "<wa-relative-time>"
    examples:
      - heading: "Icon"
      - title: "Inline"
        description: "Inline `$$$name` drops a decorative icon mid-prose."
        code: |
          Open the $$$gear settings panel to continue.
      - title: "Block with label"
        description: "A non-empty block body becomes the icon’s accessible label."
        code: |
          :::wa-icon bell
          Notifications
          :::
      - title: "Icon tokens"
        description: "After the name come optional, order-independent `family` / `variant` / `animation` / `canvas` tokens."
        code: |
          :::wa-icon star shake solid
          :::
