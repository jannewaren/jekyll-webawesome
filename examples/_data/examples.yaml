  - id: "media"
    title: "Media"
    intro: |
      Carousels, before/after comparisons, video, and randomly-rotating content.
    components:
      - "<wa-carousel>"
      - "<wa-comparison>"
      - "<wa-video>"
      - "<wa-random-content>"
    examples:
      - heading: "Carousel"
      - title: "Navigation + pagination"
        description: "Separate slides with `~~~`. Toggle arrows with `navigation` and dots with `pagination`."
        code: |
          ~~~~~~navigation pagination
          ~~~
          Slide one
          ~~~
          ~~~
          Slide two
          ~~~
          ~~~
          Slide three
          ~~~
          ~~~~~~
      - title: "Autoplay + loop"
        code: |
          ~~~~~~autoplay autoplay-interval:2500 loop pagination
          ~~~
          Auto-advances every 2.5s
          ~~~
          ~~~
          …then loops back
          ~~~
          ~~~~~~
      - title: "Image slides"
        code: |
          ~~~~~~navigation loop
          ~~~
          ![First](../assets/photo.jpg)
          ~~~
          ~~~
          ![Second](../assets/before.jpg)
          ~~~
          ~~~~~~
      - heading: "Comparison"
      - title: "Before / after"
        description: "Exactly two images: the first is the “before” slot, the second the “after”. Drag the slider."
        code: |
          |||
          ![Before](../assets/before.jpg)
          ![After](../assets/photo.jpg)
          |||
      - title: "Custom start position"
        description: "A number (0–100) sets the initial slider position."
        code: |
          |||25
          ![Before](../assets/before.jpg)
          ![After](../assets/photo.jpg)
          |||
      - heading: "Video"
      - title: "Standard controls"
        description: "The first link supplies the title and src; the first image supplies the poster. `<wa-video>` is Web Awesome Pro."
        code: |
          ;;;
          [Sample clip](../assets/video.mp4)
          ![Poster](../assets/poster.jpg)
          ;;;
      - title: "Full controls"
        code: |
          ;;;controls:full
          [Sample clip](../assets/video.mp4)
          ![Poster](../assets/poster.jpg)
          ;;;
      - heading: "Random content"
      - title: "Random tip"
        description: "Shows a random subset of its options and hides the rest — zero JavaScript to author."
        code: |
          ......mode:random items:1 animation:fade
          Tip: press ⌘K to search.
          >>>
          Tip: star the repo to follow releases.
          >>>
          Tip: callouts support animated icons.
          ......
      - title: "Autoplay rotation"
        code: |
          ......mode:random items:1 autoplay autoplay-interval:3000 animation:fade-up
          “Best component library I’ve used.”
          >>>
          “Shipped our marketing site in a weekend.”
          >>>
          “The docs are excellent.”
          ......
  - id: "layouts"
    title: "Layouts"
    intro: |
      Zero-media-query layout primitives that map to Web Awesome CSS utilities: grid, stack, cluster, split, flank, and frame.
    components:
      - ".wa-grid"
      - ".wa-stack"
      - ".wa-cluster"
      - ".wa-split"
      - ".wa-flank"
      - ".wa-frame"
    examples:
      - heading: "Grid"
      - title: "Auto-adaptive columns"
        description: "Children wrap based on `min` column size — resize the window to see it reflow."
        code: |
          ::::grid gap:l min:200px
          ===accent
          # One
          Wraps responsively.
          ===

          ===accent
          # Two
          No media queries.
          ===

          ===accent
          # Three
          Auto columns.
          ===
          ::::
      - heading: "Stack"
      - title: "Vertical rhythm"
        description: "Consistent vertical spacing between blocks."
        code: |
          ::::stack gap:m
          :::info
          First item
          :::

          :::success
          Second item
          :::

          :::warning
          Third item
          :::
          ::::
      - heading: "Cluster"
      - title: "Wrapping tag row"
        description: "Inline items that wrap — great for tag clouds and button rows."
        code: |
          ::::cluster gap:s
          @@@brand
          Ruby
          @@@
          @@@success
          Jekyll
          @@@
          @@@neutral
          Eleventy
          @@@
          @@@warning
          Markdown
          @@@
          ::::
      - heading: "Split"
      - title: "Opposite ends"
        description: "Pushes children to opposite ends of the row — the classic header/footer pattern. Put HTML or components (not bare Markdown) directly inside layout containers."
        code: |
          ::::split
          <strong>© 2026 Markawesome</strong>
          <span><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></span>
          ::::
      - heading: "Flank"
      - title: "Sidebar + content"
        code: |
          ::::flank start size:160px gap:l
          <img src="../assets/thumb.jpg" alt="Thumbnail">
          :::info
          The 160px sidebar stays fixed while the content flexes — both wrap to one column on narrow screens.
          :::
          ::::
      - heading: "Frame"
      - title: "Aspect ratio: landscape"
        code: |
          ::::frame landscape radius:l
          <img src="../assets/photo.jpg" alt="landscape frame">
          ::::
      - title: "Aspect ratio: portrait"
        code: |
          ::::frame portrait radius:l
          <img src="../assets/photo.jpg" alt="portrait frame">
          ::::
      - title: "Aspect ratio: square"
        code: |
          ::::frame square radius:l
          <img src="../assets/photo.jpg" alt="square frame">
          ::::
