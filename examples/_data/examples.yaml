      - title: "Every canvas mode"
        description: "The **canvas** is the box an icon sits in — it changes the box, not the glyph. Each mode shows the same five different-width icons in a tinted, dashed box so the reserved spacing is visible: `fixed` (default) gives every icon the same box so they line up; `auto` lets each take its natural width; `square` and `roomy` are larger uniform boxes."
        code: |
          ::::stack gap:m
          ===plain
          **fixed** · `1.25 × 1em` — same box for every glyph — aligns icons in lists & menus

          :::wa-icon ruler-horizontal fixed
          :::
          :::wa-icon image fixed
          :::
          :::wa-icon face-smile fixed
          :::
          :::wa-icon file fixed
          :::
          :::wa-icon ruler-vertical fixed
          :::
          ===
          ===plain
          **auto** · `auto × 1em` — each glyph keeps its natural width (ruler-horizontal wide, ruler-vertical narrow)

          :::wa-icon ruler-horizontal auto
          :::
          :::wa-icon image auto
          :::
          :::wa-icon face-smile auto
          :::
          :::wa-icon file auto
          :::
          :::wa-icon ruler-vertical auto
          :::
          ===
          ===plain
          **square** · `1.25 × 1.25em` — a uniform square footprint for standalone icons

          :::wa-icon ruler-horizontal square
          :::
          :::wa-icon image square
          :::
          :::wa-icon face-smile square
          :::
          :::wa-icon file square
          :::
          :::wa-icon ruler-vertical square
          :::
          ===
          ===plain
          **roomy** · `1.5 × 1.5em` — a larger uniform box for standalone icons that need breathing room

          :::wa-icon ruler-horizontal roomy
          :::
          :::wa-icon image roomy
          :::
          :::wa-icon face-smile roomy
          :::
          :::wa-icon file roomy
          :::
          :::wa-icon ruler-vertical roomy
          :::
          ===
          ::::
